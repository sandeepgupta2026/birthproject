<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Memories</title>

    <link rel="stylesheet" href="message.css">

    <!-- Handwriting Font -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts"></div>

    <!-- Scrapbook -->
    <section class="scrapbook">

        <h1>Happy Birthday ❤️</h1>

        <p class="subtitle">
            Every picture has a beautiful memory...
        </p>

        <div class="board">

            <!-- Photo 1 -->
            <div class="card card1">
                <div class="tape"></div>
                <img src="../n.i/neha11.jpeg">
            </div>

            <!-- Photo 2 -->
            <div class="card card2">
                <div class="tape"></div>
                <img src="../n.i/neha8.jpeg">
            </div>

            <!-- Photo 3 -->
            <div class="card card3">
                <div class="tape"></div>
                <img src="../n.i/neha12.jpeg">
            </div>

            <!-- Photo 4 -->
            <div class="card card4">
                <div class="tape"></div>
                <img src="../n.i/neha3.jpeg">
            </div>

            <!-- Center Photo -->
            <div class="card center">
                <div class="tape"></div>
                <img src="../n.i/neha7.jpeg">
            </div>

            <!-- Decorations -->
            <span class="flower flower1">🌸</span>
            <span class="flower flower2">🌼</span>
            <span class="flower flower3">🌿</span>
            <span class="flower flower4">🌷</span>

        </div>

        <div class="letter">

            <h2>YOU KNOW </h2>

            <p>
                Every smile of yours is a beautiful memory,
                every moment with you is a precious gift.
                Wishing you endless happiness,
                laughter and love.
            </p>

        </div>

        <button id="nextBtn">
            🎁 
        </button>

    </section>

    <script src="message.js"></script>

</body>

</html>
