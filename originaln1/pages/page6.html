<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise ❤️</title>

<link rel="stylesheet" href="final.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- ===========================================
            NIGHT SKY
=========================================== -->

<div id="sky">

    <div id="stars"></div>

    <div id="shootingStars"></div>

    <div id="clouds"></div>

</div>

<!-- ===========================================
            CANVAS
=========================================== -->

<canvas id="canvas"></canvas>

<!-- ===========================================
            OPENING SCREEN
=========================================== -->

<section id="openingSection">

    <h2>A Special Night...</h2>

    <h1>Just For You ❤️</h1>

</section>

<!-- ===========================================
            GIFT SECTION
=========================================== -->

<section id="giftSection">

    <h1>One Last Surprise...</h1>

    <p>Click the Gift ❤️</p>

    <div id="gift">

        <div class="lid">

            <div class="bow">🎀</div>

            <div class="ribbonVertical"></div>

            <div class="ribbonHorizontal"></div>

        </div>

        <div class="box">

            <div class="ribbonVertical"></div>

            <div class="ribbonHorizontal"></div>

        </div>

        <div class="magicLight"></div>

    </div>

    <button id="openGift">

        🎁 Open Gift

    </button>

</section>

<!-- ===========================================
            HEART
=========================================== -->

<section id="heartSection">

    <h2>

        Listen To My Heart ❤️

    </h2>

</section>

<!-- ===========================================
            PARTICLE NAME
=========================================== -->

<section id="nameSection">

    <canvas id="nameCanvas"></canvas>

    <!-- <div id="namePhotoBox">

    <img
    src="../n.i/nehaascii.png"
    id="namePhoto"
    alt="Priya">

</div> -->



</section>

<!-- ===========================================
            PHOTO
=========================================== -->

    <div class="photoFrame">

        <img
        src="../n.i/heha10.jpeg"
        id="birthdayPhoto"
        alt="Birthday">

    </div>

</section> -->

<!-- ===========================================
            MESSAGE
=========================================== -->

<section id="messageSection">

    <h1>

        Happy Birthday ❤️

    </h1>

    <div id="letter">

        <p id="typingMessage"></p>

    </div>

    <button id="replay">

        🔄 Replay

    </button>

</section>

<!-- ===========================================
            AUDIO
=========================================== -->

<audio id="bgMusic" loop>
    <source src="../music/bg.mp3" type="audio/mpeg">
</audio>

<audio id="boom">
    <source src="../music/boom.mp3" type="audio/mpeg">
</audio>

<audio id="rocket">
    <source src="../music/rocket.mp3" type="audio/mpeg">
</audio>

<audio id="heartbeat">
    <source src="../music/heartbeat.mp3" type="audio/mpeg">
</audio>

<audio id="firework">
    <source src="../music/firework.mp3" type="audio/mpeg">
</audio>

<script src="final.js"></script>

</body>
</html>
