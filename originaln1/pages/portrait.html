<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Memories</title>

<link rel="stylesheet" href="portrait.css">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

</head>

<body>

<div class="container">

    <!-- Birthday Flags -->
    <div class="flags"></div>

    <!-- Heading -->
    <h1>Happy Birthday</h1>

    <!-- Main Section -->
    <div class="content">

        <!-- Photo -->
        <div class="photoBox">

            <div class="polaroid">

                <img id="photo"
                src="">

            </div>
           

        </div>

        <!-- Message -->
        <div class="messageBox">

            <h2 id="title">
                Beautiful Smile ❤️
            </h2>

            <p id="message">

                Every smile of yours makes
                the world brighter.

                May your happiness never end.

                Happy Birthday 🎂

            </p>

            <!-- Next Arrow -->

            <button id="nextBtn">

                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </div>

    </div>

    <!-- Balloons -->

    <div class="balloons">

        

    </div>

</div>

<script src="portrait.js"></script>

</body>
</html>
